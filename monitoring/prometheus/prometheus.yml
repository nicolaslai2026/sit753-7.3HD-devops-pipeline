global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'mmm-art-studio'
    metrics_path: /metrics
    static_configs:
      - targets: ['mmm-production:3000']
        labels: { env: 'production' }
      - targets: ['mmm-staging:3000']
        labels: { env: 'staging' }
