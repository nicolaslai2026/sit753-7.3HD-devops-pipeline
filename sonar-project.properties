sonar.projectKey=mmm-art-studio
sonar.projectName=MMM Art Studio
sonar.sourceEncoding=UTF-8

# What counts as source vs tests
sonar.sources=server.js,notify.js,scripts,public
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Exclusions: generated / third-party / non-code files
sonar.exclusions=node_modules/**,reports/**,data/**,monitoring/**,public/**/*.css
# Seed data is intentionally repetitive, so leave it out of duplication checks
sonar.cpd.exclusions=scripts/seed.js

# Coverage from Jest (feeds the "Coverage" quality-gate condition)
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info

# Browser code runs in the browser, not in Jest, so exclude it from coverage only (still analysed for issues)
sonar.coverage.exclusions=public/**
